name: Submit Firefox
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amo-submission
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: firefox-store
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== "v"+p.version) process.exit(1)'
      - run: npx playwright install --with-deps chromium firefox
      - run: xvfb-run --auto-servernum npm run verify
      - run: npm run package
      - name: Submit listed add-on and sources to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: node scripts/submit-firefox.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-submission
          path: artifacts/
