name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - uses: cachix/devenv-install-action@v1
      - run: devenv shell -- npm ci
      - run: devenv shell -- npx playwright install --with-deps chromium firefox
      - run: devenv shell -- npm run verify
      - run: devenv shell -- npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: x-timeline-blocker-packages
          path: artifacts/*.zip
